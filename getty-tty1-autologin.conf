# getty-tty1-autologin.conf — instaluje se jako
# /etc/systemd/system/getty@tty1.service.d/autologin.conf
#
# Přihlášení bez hesla na fyzické konzoli: po restartu má box na TV hned
# spustit okno trackeru, ne čekat na login prompt (viz box-console.sh on).
# Bez hesla je to schválně — box je ve výstavě a na tty1 je jinak nikdo.
#
# Pozor: každý, kdo sedí u TV, tím získá shell uživatele pi. Pro ladění
# po SSH to nehraje roli (tady je jen tty1).
#
# Po instalaci: systemctl restart getty@tty1 (z SSH bezpečné) nebo reboot.
# Zpět na login prompt: box-console.sh off.

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin pi --noclear %I $TERM
